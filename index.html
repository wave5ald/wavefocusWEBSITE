<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wave Focus — Daily Routine & Focus Timer</title>
<meta name="description" content="Daily routine tracker with auto-resetting tasks, streaks, focus timer, quests, notes and progress analytics. Works offline.">

<!-- ── PWA / installability ───────────────────────────────────────────── -->
<link rel="manifest" href="manifest.json">
<meta name="application-name" content="Wave Focus">
<meta name="theme-color" content="#0B0F19" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">

<!-- ── iOS standalone (native app feel) ───────────────────────────────── -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wave Focus">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="referrer" content="strict-origin-when-cross-origin">

<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
<link rel="apple-touch-icon-precomposed" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="mask-icon" href="icons/icon-192.png" color="#38BDF8">

<!-- iOS launch images (full-screen splash while the app boots) -->
<link rel="apple-touch-startup-image" href="splash/splash-iphone-15-pro-max.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/splash-iphone-15-pro.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/splash-iphone-14-plus.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/splash-iphone-13.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/splash-iphone-x.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/splash-iphone-xs-max.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/splash-iphone-xs-max.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/splash-iphone-11.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/splash-iphone-8.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/splash-iphone-8-plus.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/splash-ipad-pro-11.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/splash-ipad-pro-12.png" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
<link rel="apple-touch-startup-image" href="splash/splash-ipad-air.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">

<!-- ── App styles ─────────────────────────────────────────────────────── -->
<link rel="stylesheet" href="css/app.css">

<!-- Pick the right status-bar style before first paint (iOS reads this at launch) -->
<script>
  (function () {
    try {
      var raw = localStorage.getItem('wavefocus.pwa.v2') || localStorage.getItem('wavefocus.pwa.v1');
      var settings = raw ? (JSON.parse(raw).settings || {}) : {};
      var theme = settings.theme || 'system';
      var dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      var meta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
      if (meta) meta.setAttribute('content', dark ? 'black-translucent' : 'default');
      var lang = settings.lang === 'ar' ? 'ar' : 'en';
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.style.background = dark ? '#0B0F19' : '#F8FAFC';
    } catch (e) { /* first run */ }
  })();
</script>
</head>
<body>
<div id="app" class="app" data-theme="dark">

  <!-- Top app bar -->
  <header class="topbar" id="topbar">
    <div class="topbar__lead">
      <img class="brandmark" src="icons/icon-192.png" alt="" width="28" height="28">
      <h1 class="topbar__title" id="screenTitle">Routine</h1>
    </div>
    <div class="topbar__actions">
      <button class="chip chip--ghost" id="editionBtn" type="button" aria-label="Switch edition">
        <span class="chip__emoji" id="editionEmoji">🌙</span><span id="editionLabel">Hijri</span>
      </button>
      <button class="chip chip--ghost" id="langBtn" type="button" aria-label="Switch language">
        <span id="langLabel">العربية</span>
      </button>
      <button class="icon-btn" id="moreBtn" type="button" aria-label="More pages and settings" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </header>

  <!-- Offline / update notices -->
  <div class="banner banner--offline" id="offlineBanner" hidden>You are offline — Wave Focus keeps working.</div>
  <div class="banner banner--update" id="updateBanner" hidden>
    <span>A new version is ready.</span>
    <button class="btn btn--tiny" id="reloadBtn" type="button">Reload</button>
  </div>

  <!-- Screen host -->
  <main class="screen" id="screen" tabindex="-1"></main>

  <!-- Contextual action button (Add task / quest / note) -->
  <button class="fab" id="fab" type="button" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span class="fab__label" id="fabLabel">Add Task</span>
  </button>

  <!-- Bottom navigation (becomes a side rail on wide screens) -->
  <nav class="tabbar" id="tabbar" aria-label="Primary">
    <button class="tab is-active" data-tab="routine" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14.1l-3-3"/></svg>
      <span data-i18n="routine">Routine</span>
    </button>
    <button class="tab" data-tab="focus" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>
      <span data-i18n="focus">Focus</span>
    </button>
    <button class="tab" data-tab="schedule" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>
      <span data-i18n="schedule">Schedule</span>
    </button>
    <button class="tab" data-tab="notes" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l5 5v13H6z"/><path d="M15 3v5h5M9 13h6M9 17h4"/></svg>
      <span data-i18n="notes">Notes</span>
    </button>
  </nav>

  <!-- Sheet / dialog host, install UI and toasts -->
  <div class="sheet-host" id="sheetHost" hidden></div>
  <div class="toast-host" id="toastHost" aria-live="polite"></div>
  <div class="install-host" id="installHost" hidden></div>

  <div class="splash" id="bootSplash">
    <img src="icons/icon-192.png" alt="Wave Focus" width="96" height="96">
    <p>Wave Focus</p>
  </div>
</div>

<noscript>
  <div style="padding:24px;font:16px/1.5 system-ui;color:#E2E8F0;background:#0B0F19;min-height:100vh">
    Wave Focus needs JavaScript enabled to track your routine and focus sessions.
  </div>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1424"/>
      <stop offset=".55" stop-color="#08101E"/>
      <stop offset="1" stop-color="#060C16"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#EAF3FF"/>
      <stop offset=".45" stop-color="#CDE5FF"/>
      <stop offset="1" stop-color="#4A97EE"/>
    </linearGradient>
    <linearGradient id="sun" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFD469"/>
      <stop offset="1" stop-color="#F0AE22"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2F7FE0" stop-opacity=".32"/>
      <stop offset="1" stop-color="#2F7FE0" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <rect width="1024" height="1024" fill="#000"/>
      <circle cx="762" cy="386" r="166" fill="#fff"/>
      <circle cx="708" cy="452" r="146" fill="#000"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="784" cy="404" r="336" fill="url(#glow)"/>

  <!-- golden crescent, opening towards the lower left -->
  <circle cx="762" cy="386" r="166" fill="url(#sun)" mask="url(#crescent)"/>

  <!-- small wave tucked into the crescent's bowl -->
  <path d="M690 466 C 720 440 752 440 778 456 C 796 468 812 470 828 462"
        fill="none" stroke="#4A97EE" stroke-width="22" stroke-linecap="round" opacity=".9"/>

  <!-- the main wave -->
  <path d="M96 690 C 210 540 366 500 500 582 C 610 650 672 706 786 694 C 862 686 906 646 926 600"
        fill="none" stroke="url(#wave)" stroke-width="128" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- thin echo wave under the crest -->
  <path d="M150 828 C 268 722 372 722 470 786 C 566 848 640 874 730 854"
        fill="none" stroke="#3E8BE8" stroke-width="34" stroke-linecap="round" opacity=".75"/>
</svg>
